name: Deploy React Website via SSH to Omaanu.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Build & 🚀 Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: 🚀 Deploy to Hostinger via Rsync & SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '46.28.45.74' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER || 'u408469790' }}
          SSH_PASS: ${{ secrets.SSH_PASS || secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass rsync

          TARGET="/home/$SSH_USER/domains/omaanu.com/public_html"

          echo "Backing up old WordPress files if present..."
          sshpass -p "$SSH_PASS" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$SSH_HOST" "
            DIR=\"$TARGET\"
            [ ! -d \"\$DIR\" ] && DIR=\"/home/$SSH_USER/public_html\"
            cd \"\$DIR\" || exit 0
            if [ -f \"wp-login.php\" ] || [ -d \"wp-admin\" ] || [ -f \"index.php\" ]; then
              mkdir -p _wp_backup
              mv wp-* index.php _wp_backup/ 2>/dev/null || true
            fi
          " || echo "Remote backup step finished."

          echo "Syncing dist build to $TARGET..."
          sshpass -p "$SSH_PASS" rsync -avz \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./dist/ "$SSH_USER@$SSH_HOST:$TARGET/"

          echo "Setting proper permissions on remote server..."
          sshpass -p "$SSH_PASS" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$SSH_HOST" "
            DIR=\"$TARGET\"
            [ ! -d \"\$DIR\" ] && DIR=\"/home/$SSH_USER/public_html\"
            cd \"\$DIR\" || exit 0
            chmod 644 index.html .htaccess 2>/dev/null || true
            chmod -R 755 assets 2>/dev/null || true
          " || true

          echo "✅ Deployment completed successfully!"